name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Pre-Fetch Game Libraries
      run: |
        mkdir Refs_Base
        # This downloads the unstripped BONELAB files to resolve the SLZ & RigManager spaces
        curl -L -o refs.zip "https://github.com"
        powershell Expand-Archive -Path refs.zip -DestinationPath Refs_Base -Force
      shell: cmd

    - name: Auto-Generate Project File
      run: |
        $projectXml = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="LavaGang.MelonLoader" Version="0.6.1" />
            <PackageReference Include="UnityEngine" Version="1.0.0" />
            
            <!-- This tells the compiler to look at your uploaded files FIRST -->
            <Reference Include="*.dll" />
            <Reference Include="**/*.dll" />
            
            <!-- This connects the background engine folder -->
            <Reference Include="Refs_Base/**/*.dll" />
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "Mod.csproj" -Value $projectXml
      shell: powershell

    - name: Compile Mod DLL
      run: dotnet build Mod.csproj --configuration Release --output ./build

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-DLL
        path: ./build/*.dll
