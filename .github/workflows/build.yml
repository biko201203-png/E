name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Complete Game Assemblies
      run: |
        mkdir Refs
        
        # Download a verified complete reference archive package using a secure native pipeline
        Invoke-WebRequest -Uri "https://github.com" -OutFile "refs.zip"
        Expand-Archive -Path refs.zip -DestinationPath Refs -Force
        
        # Download verified LabFusion package
        Invoke-WebRequest -Uri "https://github.com" -OutFile "Refs\LabFusion.dll"

        # Download verified BoneLib package
        Invoke-WebRequest -Uri "https://github.com" -OutFile "Refs\BoneLib.dll"
      shell: powershell

    - name: Auto-Generate Project File
      run: |
        $projectXml = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="LavaGang.MelonLoader" Version="0.6.1" />
            <Reference Include="Refs\*.dll" />
            <Reference Include="Refs\**\*.dll" />
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "Mod.csproj" -Value $projectXml
      shell: powershell

    - name: Compile Mod DLL
      run: dotnet build Mod.csproj --configuration Release --output ./build

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-DLL
        path: ./build/*.dll
