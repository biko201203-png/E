name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download Reference Libraries
      run: |
        mkdir Refs
        
        # 1. Download BONELAB reference files
        curl -L -o bonelab_refs.zip "https://github.com"
        powershell Expand-Archive -Path bonelab_refs.zip -DestinationPath Refs -Force
        
        # 2. Download explicit Unity dependencies
        curl -L -o unity_refs.zip "https://github.com"
        powershell Expand-Archive -Path unity_refs.zip -DestinationPath Refs -Force
        
        # 3. Fetch LabFusion assembly
        curl -L -o Refs\LabFusion.dll "https://github.com"

        # 4. Fetch missing BoneLib assembly to resolve final compilation errors
        curl -L -o Refs\BoneLib.dll "https://github.com"
      shell: cmd

    - name: Auto-Generate Project File
      run: |
        $projectXml = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <PackageReference Include="LavaGang.MelonLoader" Version="0.6.1" />
            <Reference Include="Refs\**\*.dll" />
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "Mod.csproj" -Value $projectXml
      shell: powershell

    - name: Compile Mod DLL
      run: dotnet build Mod.csproj --configuration Release --output ./build

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-DLL
        path: ./build/*.dll
