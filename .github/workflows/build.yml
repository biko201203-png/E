name: Build BONELAB Mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '6.0.x'

    - name: Download BONELAB, Unity & Fusion References
      run: |
        # Create a directory to hold all necessary compilation files
        mkdir Refs
        
        # 1. Download BONELAB modding reference files
        curl -L -o bonelab_refs.zip "https://github.com"
        powershell Expand-Archive bonelab_refs.zip -DestinationPath Refs_Temp
        move Refs_Temp\* Refs\
        
        # 2. Download explicit Unity engine dependencies to resolve UnityEngine/Vector3/KeyCode errors
        curl -L -o unity_refs.zip "https://github.com"
        powershell Expand-Archive unity_refs.zip -DestinationPath Unity_Temp
        move Unity_Temp\* Refs\
        
        # 3. Download LabFusion references to resolve Fusion namespace errors
        curl -L -o fusion_refs.zip "https://github.com"
        move LabFusion.dll Refs\
      shell: powershell

    - name: Auto-Generate Project File
      run: |
        $projectXml = @"
        <Project Sdk="Microsoft.NET.Sdk">
          <PropertyGroup>
            <TargetFramework>net6.0</TargetFramework>
            <ImplicitUsings>enable</ImplicitUsings>
            <Nullable>enable</Nullable>
          </PropertyGroup>
          <ItemGroup>
            <!-- Core MelonLoader References via NuGet -->
            <PackageReference Include="LavaGang.MelonLoader" Version="0.6.1" />
            <!-- Links every single downloaded game, Unity, and Fusion file cleanly -->
            <Reference Include="Refs\*.dll" />
          </ItemGroup>
        </Project>
        "@
        Set-Content -Path "Mod.csproj" -Value $projectXml
      shell: powershell

    - name: Compile Mod DLL
      run: dotnet build Mod.csproj --configuration Release --output ./build

    - name: Upload Finished DLL
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-Mod-DLL
        path: ./build/*.dll
